<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Guardian Driver</title>
<style>
*{box-sizing:border-box}html{background:#10191e;color:#f6f8f4;font:16px system-ui,sans-serif;color-scheme:dark}
body{max-width:34rem;margin:auto;padding:clamp(16px,5vw,30px)}header,.bar,.metrics,footer{display:flex;align-items:center;justify-content:space-between;gap:12px}
header{border-bottom:1px solid #364349;padding-bottom:14px;font-weight:750}header b{color:#bcf674}small,.label{font-size:.8rem;color:#bdcccf}
h1{font-size:clamp(1.8rem,7vw,2.7rem);letter-spacing:-.045em;margin:20px 0 4px}#trip{margin:0 0 18px;color:#bdcccf}
.metrics{align-items:stretch;background:#1d2b31;border-radius:18px;padding:18px;border:1px solid #35454c}.metrics>div{flex:1}.metrics>div+div{border-left:1px solid #47575b;padding-left:18px}
.value{display:block;font-size:1.65rem;margin-top:3px;font-weight:730}.value small{font-weight:500}
#risk[data-level=HIGH]{color:#ff9384}#risk[data-level=CAUTION]{color:#ffd179}#risk[data-level=LOW]{color:#bcf674}
output{display:block;margin:12px 2px 18px;color:#d2dedf;min-height:2.6em;font-size:.95rem}
.feed{margin:0;border:1px solid #35454c;border-radius:16px;overflow:hidden;background:#081014}
.bar{padding:10px 14px;background:#1d2b31;font-size:.88rem}.bar span{color:#b7c7cb}
video{display:block;width:100%;height:clamp(160px,30dvh,290px);object-fit:contain}
.view{position:relative}#faceBox{position:absolute;pointer-events:none;border:2px solid silver;transition:left .09s linear,top .09s linear,width .09s linear,height .09s linear}
footer{margin-top:18px}button{border:1px solid #526369;border-radius:12px;padding:14px 16px;font:inherit;font-weight:650;color:white;background:#243237}
#start{background:#bcf674;color:#15230c;border-color:transparent;flex:1}button:disabled,#start:disabled{background:#233138;color:#94a4a7}button:focus-visible{outline:3px solid #fff}
</style>
<header><strong><b>◈</b> Fleet Guardian</strong><small id="connection">Standby</small></header>
<h1>Driver monitor</h1><p id="trip">Awaiting assignment details</p>
<section class="metrics"><div><span class="label">Driver activity</span><strong class="value" id="risk">—</strong></div><div><span class="label">Speed</span><strong class="value"><span id="speed">—</span> <small>km/h</small></strong></div></section>
<p id="modelPrediction" hidden></p>
<output id="status" aria-live="polite">Ready to connect</output>
<details><summary>Sensor details</summary><small id="sensorDetails">Waiting for phone sensors</small></details>
<figure class="feed"><figcaption class="bar"><strong>Driver camera</strong><span id="cameraState">Off</span></figcaption><div class="view"><video id="camera" autoplay muted playsinline></video><i id="faceBox" hidden></i></div></figure>
<footer><button id="start">Start monitoring</button><button id="stop" disabled>Stop</button></footer>
<p><button id="calibrate" disabled>Set road-facing position</button> <small id="mountNote">For a side mount, set this while parked.</small></p>
<script>
const video=document.querySelector('video'), statusBox=document.querySelector('output');
const start=document.querySelector('#start'), stop=document.querySelector('#stop');
const canvas=document.createElement('canvas'), token=location.hash.slice(1);
let generation=0, watch=null, stream=null, audio=null, gps=null, motion=null, alarm=null;
let offset=null, syncedAt=0;
let anchor=null, gpsStatus='', tripId=null;
let calibration=null;
document.querySelector('#calibrate').onclick=()=>{
  calibration=crypto.randomUUID();
  field('mountNote').textContent='Look straight at the road and hold still.';
};
const previewCanvas=document.createElement('canvas');
let motionConfirmedUntil=0;
function updateGPS(position){
  const c=position.coords, stamp=position.timestamp/1000;
  if(gps && stamp<=gps.timestamp)return;
  const previous=gps;
  gps={timestamp:stamp,speed_mps:c.speed,accuracy_m:c.accuracy,estimated:false};
  gpsStatus='';
  if(c.accuracy>30){anchor=null;motionConfirmedUntil=0;return;}
  // Low GPS speeds can drift even on a desk. Require displacement before
  // reporting slow movement; retain genuine slow readings once confirmed.
  if(Number.isFinite(c.speed) && c.speed>=0 && (c.speed===0 || c.speed>=3 || motionConfirmedUntil>stamp)){
    if(c.speed===0)motionConfirmedUntil=0;
    if(c.speed>=3)motionConfirmedUntil=stamp+5;
    anchor=position;return;
  }
  gps.speed_mps=null;gpsStatus='estimating';
  if(previous?.estimated && stamp>=previous.timestamp && stamp-previous.timestamp<5){
    gps=previous;gpsStatus='';
  }
  if(!anchor){anchor=position;return;}
  const seconds=(position.timestamp-anchor.timestamp)/1000;
  if(seconds<=0 || seconds>30){anchor=position;motionConfirmedUntil=0;return;}
  if(seconds<2)return;
  const rad=Math.PI/180, a=anchor.coords;
  const north=(c.latitude-a.latitude)*rad;
  const east=((c.longitude-a.longitude+540)%360-180)*rad*Math.cos((a.latitude+c.latitude)*rad/2);
  const metres=6371000*Math.hypot(north,east);
  if(metres<=a.accuracy+c.accuracy){
    if(seconds>=5 && Math.max(a.accuracy,c.accuracy)<=15 && metres<=Math.max(2,Math.min(a.accuracy,c.accuracy))){
      gps={timestamp:stamp,speed_mps:0,accuracy_m:c.accuracy,estimated:true};gpsStatus='';
      if(seconds>=20)anchor=position;
    }
    return;
  }
  const speed=metres/seconds;
  anchor=position;
  if(speed<=250/3.6){motionConfirmedUntil=stamp+5;gps={timestamp:stamp,speed_mps:speed,accuracy_m:c.accuracy,estimated:true};gpsStatus='';}
}
async function preview(id){
  if(id!==generation)return;
  try{
    if(tripId && !document.hidden && video.readyState>=2 && video.videoWidth){
      const trip=tripId, scale=Math.min(1,480/Math.max(video.videoWidth,video.videoHeight));
      previewCanvas.width=Math.round(video.videoWidth*scale);
      previewCanvas.height=Math.round(video.videoHeight*scale);
      previewCanvas.getContext('2d').drawImage(video,0,0,previewCanvas.width,previewCanvas.height);
      const jpeg=await new Promise(resolve=>previewCanvas.toBlob(resolve,'image/jpeg',.6));
      if(jpeg && id===generation){
        const response=await fetch('/preview',{method:'POST',headers:{Authorization:'Bearer '+token,'X-Trip':String(trip)},body:jpeg,signal:AbortSignal.timeout(1200)});
        if(!response.ok)throw Error('Preview unavailable');
        const tracking=await response.json();
        if(id===generation)showBox(tracking.box,tracking.level);
      }
    }
  }catch(error){if(id===generation)showBox(null);}
  if(id===generation)setTimeout(()=>preview(id),65);
}
const field=id=>document.getElementById(id);
function showBox(box,level){
  const el=field('faceBox');el.hidden=!box;
  field('cameraState').textContent=box?'Face tracked':'Looking for face';
  if(!box)return;
  const scale=Math.min(video.clientWidth/video.videoWidth,video.clientHeight/video.videoHeight);
  const w=video.videoWidth*scale,h=video.videoHeight*scale;
  el.style.left=((video.clientWidth-w)/2+box[0]*w)+'px';el.style.top=((video.clientHeight-h)/2+box[1]*h)+'px';
  el.style.width=box[2]*w+'px';el.style.height=box[3]*h+'px';
  el.style.borderColor=({LOW:'#44d264',CAUTION:'#ff9b23',HIGH:'#f5413c'})[level]||'silver';
}
function assessment(level,speed,label='—'){
  field('risk').textContent=label;field('risk').dataset.level=level;
  field('speed').textContent=Number.isFinite(speed)?speed.toFixed(1):'—';
}
function gpsDetail(){
  if(!gps)return ({denied:'Location permission denied',timeout:'Location request timed out',
    unavailable:'Phone location unavailable'})[gpsStatus] || 'Waiting for a location fix';
  const age=Math.max(0,Math.floor(Date.now()/1000-gps.timestamp));
  const accuracy=Math.round(gps.accuracy_m);
  if(age>5)return 'GPS fix is '+age+' seconds old';
  if(accuracy>30)return 'GPS accuracy ±'+accuracy+' m · move outdoors for a clearer fix';
  return 'GPS accuracy ±'+accuracy+' m'+(gps.speed_mps===null?' · waiting for measurable movement':'');
}
async function syncClock(){
  const before=performance.now();
  const response=await fetch('/clock',{cache:'no-store',signal:AbortSignal.timeout(3000)});
  if(!response.ok)throw Error('Restart the PC launcher and reopen the new vehicle link.');
  const serverTime=await response.json(), after=performance.now();
  if(after-before>1500)throw Error('Slow Wi-Fi. Retrying connection…');
  offset=serverTime-(before+after)/2000;syncedAt=after;
}
function readMotion(e){
  function vector(obj,keys,scale){
    if(!obj || !keys.every(k=>Number.isFinite(obj[k])))return null;
    return keys.map(k=>obj[k]*scale);
  }
  motion={time:Date.now(),accelerometer:vector(e.accelerationIncludingGravity,['x','y','z'],1),
          gyroscope:vector(e.rotationRate,['beta','gamma','alpha'],Math.PI/180)};
}
function end(){
  field('modelPrediction').hidden=true;
  calibration=null;field('calibrate').disabled=false;field('mountNote').textContent='For a side mount, set this while parked.';
  showBox(null);
  generation++;
  if(watch!==null)navigator.geolocation.clearWatch(watch);
  if(stream)stream.getTracks().forEach(track=>track.stop());
  window.removeEventListener('devicemotion',readMotion);
  setAlarm(false);
  if(audio)audio.close().catch(()=>{});
  watch=null;stream=null;gps=null;motion=null;audio=null;video.srcObject=null;
  field('sensorDetails').textContent='Sensors stopped';
  anchor=null;motionConfirmedUntil=0;gpsStatus='';tripId=null;
  start.disabled=false;stop.disabled=true;statusBox.textContent='Stopped';
  offset=null;assessment('—',null);field('cameraState').textContent='Off';field('connection').textContent='Standby';field('trip').textContent='Monitoring ended';
}
function setAlarm(active){
  if(!active){
    if(alarm){alarm.stop();alarm.disconnect();alarm=null;}
    return;
  }
  if(alarm || !audio)return;
  const rate=16000, half=rate/4;
  const warning=audio.createBuffer(1,half*2,rate);
  const samples=warning.getChannelData(0);
  for(let i=0;i<half;i++){
    samples[i]=.32*Math.sin(2*Math.PI*880*i/rate);
    samples[i+half]=.32*Math.sin(2*Math.PI*1320*i/rate);
  }
  alarm=audio.createBufferSource();
  alarm.buffer=warning;
  alarm.loop=true;
  alarm.connect(audio.destination);
  alarm.start();
}
async function send(id){
  if(id!==generation)return;
  try{
    if(document.hidden || video.readyState<2 || !video.videoWidth)throw Error('Waiting for a visible camera preview');
    if(offset===null || performance.now()-syncedAt>60000)await syncClock();
    if(id!==generation)return;
    const scale=Math.min(1,480/Math.max(video.videoWidth,video.videoHeight));
    canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    const packet={captured:Date.now()/1000,server_capture:performance.now()/1000+offset,jpeg:canvas.toDataURL('image/jpeg',.65).split(',')[1],gps};
    packet.separate_preview=true;packet.gps_status=gpsStatus;
    if(calibration)packet.calibrate=calibration;
    if(motion && Date.now()-motion.time<3000){
      packet.accelerometer=motion.accelerometer;packet.gyroscope=motion.gyroscope;
    }
    const response=await fetch('/sample',{method:'POST',headers:{Authorization:'Bearer '+token,
      'Content-Type':'application/json'},body:JSON.stringify(packet),signal:AbortSignal.timeout(6500)});
    if(!response.ok)throw Error(await response.text());
    const report=await response.json();
    if(id!==generation)return;
    field('trip').textContent=report.driver+' · '+report.route;field('connection').textContent='Connected';
    tripId=report.trip_id;
    field('calibrate').disabled=false;
    if(!calibration || calibration===report.calibration_id){
      calibration=null;
      field('mountNote').textContent=report.mount_note || 'For a side mount, set this while parked.';
    }
    assessment(report.risk,report.speed,report.label);
    field('modelPrediction').hidden=!report.prediction || report.prediction===report.label || report.prediction.startsWith('Phone-use prediction rejected');
    field('modelPrediction').textContent='Model prediction · '+(report.prediction||'');
    statusBox.textContent=report.risk==='HIGH'?'High risk · '+report.reason:
      report.risk==='CAUTION'?'Caution · '+report.reason:
      report.speed===null?'Camera active · Waiting for GPS':
      report.speed===0?(report.speed_method==='GPS estimate'?'Appears stationary':'Stopped'):'No active alert';
    field('sensorDetails').textContent=gpsDetail()+' · Raw model guess: '+(report.raw_label||report.behavior).replaceAll('_',' ')+' (score '+(report.raw_score??report.confidence).toFixed(2)+') · Handset: '+(report.handset?'detected':'unconfirmed');
    setAlarm(report.risk==='HIGH');
  }catch(error){if(id===generation){setAlarm(false);offset=null;assessment('UNKNOWN',null);field('modelPrediction').hidden=true;field('connection').textContent='Retrying';statusBox.textContent=error.message;}}
  if(id===generation)setTimeout(()=>send(id),550);
}
start.onclick=async()=>{
  const id=++generation;start.disabled=true;stop.disabled=false;
  try{
    if(!token)throw Error('Open your vehicle link from the manager.');
    audio=new AudioContext();
    await audio.resume();
    if(id!==generation)return;
    const version=await fetch('/version',{cache:'no-store',signal:AbortSignal.timeout(4000)});
    if(!version.ok || (await version.json()).mobile!==6)
      throw Error('Close the manager windows on the PC, restart the launcher, then open the newly copied vehicle link.');
    statusBox.textContent='Allow camera, location and motion access.';
    if(id!==generation)return;
    if(window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission==='function')
      await DeviceMotionEvent.requestPermission();
    if(id!==generation)return;
    window.addEventListener('devicemotion',readMotion);
    const camera=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    if(id!==generation){camera.getTracks().forEach(t=>t.stop());return;}
    stream=camera;video.srcObject=stream;await video.play();
    field('cameraState').textContent='Live preview';field('connection').textContent='Connecting';
    if(id!==generation)return;
    watch=navigator.geolocation.watchPosition(updateGPS,e=>{
      gps=null;anchor=null;motionConfirmedUntil=0;gpsStatus=({1:'denied',2:'unavailable',3:'timeout'})[e.code]||'unavailable';
    },{enableHighAccuracy:true,maximumAge:0,timeout:5000});
    preview(id);
    send(id);
  }catch(error){if(id===generation){end();statusBox.textContent=error.message;}}
};
stop.onclick=end;window.addEventListener('pagehide',end);
</script></html>
